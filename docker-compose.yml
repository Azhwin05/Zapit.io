version: '3.9'

# Self-hosting Zapit's signaling server. The frontend is a static Next.js
# build best served from Vercel (free) or any static host. See README for
# full self-hosting instructions.
#
# TURN relay: by default this stack relies on Metered.ca's hosted TURN
# service (set METERED_API_KEY / METERED_API_HOST in signaling-server/.env)
# — no extra container needed. The optional `coturn` service below is for
# self-hosting your own TURN relay instead; it's gated behind a Compose
# profile so it does NOT start by default.
#
# Quick start (Metered.ca TURN, recommended):
#   cp signaling-server/.env.example signaling-server/.env   # fill in values
#   docker compose up -d
#
# Quick start (self-hosted TURN via coturn instead):
#   # fill in coturn/turnserver.conf placeholders first — see README
#   docker compose --profile self-hosted-turn up -d

services:
  signaling:
    build:
      context: ./signaling-server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - ./signaling-server/.env
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  coturn:
    image: coturn/coturn:latest
    profiles: ["self-hosted-turn"]
    restart: unless-stopped
    network_mode: host          # required for TURN to work correctly
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      # TLS certs — generate with: certbot certonly --standalone -d turn.yourdomain.com
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: -c /etc/coturn/turnserver.conf
    # coturn must be on the host network; its ports (3478/5349 + UDP relay range)
    # are opened by the turnserver.conf listening-port directives.
