# ─── coturn configuration for Zapit ─────────────────────────────────────────
# Replace all placeholder values before deploying.
# Docs: https://github.com/coturn/coturn/wiki/turnserver

# Listening address — 0.0.0.0 binds on all interfaces.
listening-ip=0.0.0.0

# Public IP of your VPS (required for cloud deployments where the server has a
# private NIC but a public Elastic/floating IP).
external-ip=YOUR_PUBLIC_IP

# UDP/TCP TURN port.
listening-port=3478

# TLS TURN port (TURNS — use with a valid certificate).
tls-listening-port=5349

# TLS certificate paths (Let's Encrypt recommended).
cert=/etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem
pkey=/etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem

# HMAC-SHA1 shared secret — must match TURN_SECRET env var on signaling server.
use-auth-secret
static-auth-secret=YOUR_SHARED_SECRET_HERE

# Realm shown in 401 challenges (use your domain).
realm=zapit.io

# Only relay; do not act as a STUN server here (Google STUN covers that).
no-stun

# Disable telnet / REST admin endpoints.
no-cli
no-rest-api

# Log to stdout for container-friendly operation.
log-file=stdout
# L3: Removed 'verbose' — prevents leaking client IP/port pairs into logs.

# H10: Reject any unencrypted TURN relay — all traffic must use TURNS (TLS).
no-plaintext-relay

# Restrict relay to expected fingerprints — prevents use as open relay.
fingerprint

# Limit relay bandwidth per session (bytes/sec). 5 MB/s = 5000000.
# Adjust based on your VPS tier.
max-bps=5000000

# Cap concurrent sessions.
max-allocate-lifetime=1800
channel-lifetime=600

# H10 / L4: Block loopback, multicast, and RFC 5780 peers —
# prevents SSRF-style relay attacks where TURN is used to probe internal services.
no-loopback-peers
no-multicast-peers
no-rfc5780
